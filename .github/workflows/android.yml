# Builds the Steno-Live Android app (android/) and publishes the APK under a fixed download link:
#   https://github.com/<owner>/<repo>/releases/download/steno-live-latest/steno-live.apk
# Pull requests only build and test; pushes also publish the newest APK (pre-release "steno-live-latest").
name: Android (Steno-Live)

on:
  push:
    paths:
      - "android/**"
      - "src/factcheck/steno/knowledge/**"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "android/**"
      - "src/factcheck/steno/knowledge/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: write          # needed to publish the APK as a release asset

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Android SDK packages
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" > /dev/null

      - name: Unit tests, APK and lint
        run: ./gradlew --no-daemon :core:test :app:assembleDebug :app:lintDebug

      - name: Keep test and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            android/core/build/reports/tests/
            android/app/build/reports/lint-results-debug.html
          if-no-files-found: ignore

      - name: Keep the APK
        uses: actions/upload-artifact@v4
        with:
          name: steno-live-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Publish the APK (download link for the tablet)
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk steno-live.apk
          gh release delete steno-live-latest --yes --cleanup-tag || true
          gh release create steno-live-latest steno-live.apk --prerelease --target "$GITHUB_SHA" \
            --title "Steno-Live für Android (neuester Stand)" \
            --notes "Automatisch gebaut aus ${GITHUB_REF_NAME} @ ${GITHUB_SHA::7}. Installation und Bedienung: docs/steno-android.md"
